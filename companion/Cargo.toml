[package]
name = "media-sniper-companion"
version = "1.13.1"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.1"
hex = "0.4"
getrandom = "0.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[dev-dependencies]
tempfile = "3"

[lib]
name = "media_sniper_companion"
path = "src/lib.rs"

[[bin]]
name = "media-sniper-companion"
path = "src/main.rs"

[[bin]]
name = "media-sniper-fake-tool"
path = "tests/support/fake_tool.rs"
required-features = ["test-tool"]

[features]
default = []
test-tool = []
