on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: Build and Release

description: |
  This GitHub Action will automatically create a release PR for the project
  when commits are pushed to the main branch.

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
        if: ${{ steps.release.outputs.release_created }}

      - name: Install dependencies
        run: npm ci
        if: ${{ steps.release.outputs.release_created }}

      - name: Build deterministic extension package
        run: npm run package
        if: ${{ steps.release.outputs.release_created }}

      - name: Verify extension package checksum
        run: npm run package:check
        if: ${{ steps.release.outputs.release_created }}

      - name: Upload release archive and checksum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ steps.release.outputs.tag_name }} artifacts/*.zip artifacts/*.zip.sha256 --clobber
        if: ${{ steps.release.outputs.release_created }}
